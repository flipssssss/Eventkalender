name: Eventkalender aktualisieren & veröffentlichen

on:
  # Täglich um 04:30 UTC (= ca. 05:30/06:30 deutscher Zeit) ausführen.
  schedule:
    - cron: "30 4 * * *"
  # Bei jeder Änderung am Code/an den Quellen.
  push:
    branches: ["**"]
  # Manuell per Knopfdruck im "Actions"-Tab startbar.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Verhindert parallele Pages-Deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --- Schritt 1: Veranstaltungen sammeln und Daten speichern -----------
  daten:
    name: Veranstaltungen sammeln
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Veranstaltungen sammeln
        run: python aggregate.py

      - name: Aktualisierte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Feed."
          else
            git commit -m "Feed automatisch aktualisiert"
            git push
          fi

  # --- Schritt 2: Feed-Webseite auf GitHub Pages veröffentlichen --------
  # Schlägt fehl, solange GitHub Pages nicht aktiv ist -- das ist ok und
  # betrifft Schritt 1 nicht. Sobald das Repo öffentlich ist, aktiviert
  # sich Pages hier automatisch.
  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    runs-on: ubuntu-latest
    needs: daten
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Stand (inkl. neuer Daten) auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: GitHub Pages vorbereiten (und ggf. aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Webseite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
