name: Eventkalender aktualisieren & veröffentlichen

on:
  # Täglich um 04:30 UTC (= ca. 05:30/06:30 deutscher Zeit) ausführen.
  schedule:
    - cron: "30 4 * * *"
  # Bei jeder Änderung am Code/an den Quellen.
  push:
    branches: ["**"]
  # Manuell per Knopfdruck im "Actions"-Tab startbar.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Verhindert parallele Pages-Deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --- Schritt 1: Veranstaltungen sammeln und Daten speichern -----------
  daten:
    name: Veranstaltungen sammeln
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Veranstaltungen sammeln
        run: python aggregate.py

      - name: Aktualisierte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Feed."
            exit 0
          fi
          git commit -m "Feed automatisch aktualisiert"

          # Zwei Läufe können sich überlappen (ein Push auf den Branch während
          # dieser Lauf noch sammelt, oder ein manueller Lauf parallel zum
          # nächtlichen). Dann wird der Push abgewiesen -- bisher war der Lauf
          # damit rot und das Feed-Update verloren.
          #
          # Statt zu mergen oder zu rebasen: auf den neuen Remote-Stand setzen
          # und die frisch erzeugten Daten darauf neu committen. Dadurch kann
          # es keinen Konflikt geben, und die jüngeren Daten gewinnen -- was
          # hier das Richtige ist.
          #
          # Wichtig sind zwei Details, die ein Testlauf aufgedeckt hat:
          #   * "reset --mixed" (nicht --soft): Index UND HEAD gehen auf den
          #     Remote-Stand, nur der Arbeitsbaum behält unsere neuen Dateien.
          #   * "add --ignore-removal": sonst würden Dateien, die der ANDERE
          #     Lauf unter docs/data angelegt hat und die in unserem Checkout
          #     fehlen, als Löschung mitcommittet und verschwänden.
          for versuch in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $versuch)."
              exit 0
            fi
            echo "Push abgewiesen (Versuch $versuch) -- Remote-Stand übernehmen."
            git fetch origin "$GITHUB_REF_NAME"
            git reset --mixed "origin/$GITHUB_REF_NAME"
            git add --ignore-removal docs/data
            if git diff --cached --quiet; then
              echo "Der andere Lauf hat dieselben Daten schon geschrieben."
              exit 0
            fi
            git commit -m "Feed automatisch aktualisiert"
            sleep $((versuch * 3))
          done
          echo "Push nach 5 Versuchen fehlgeschlagen." >&2
          exit 1

  # --- Schritt 2: Feed-Webseite auf GitHub Pages veröffentlichen --------
  # Schlägt fehl, solange GitHub Pages nicht aktiv ist -- das ist ok und
  # betrifft Schritt 1 nicht. Sobald das Repo öffentlich ist, aktiviert
  # sich Pages hier automatisch.
  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    runs-on: ubuntu-latest
    needs: daten
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Stand (inkl. neuer Daten) auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: GitHub Pages vorbereiten (und ggf. aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Webseite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
