<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3e9d8" />
  <title>Eventkalender</title>

  <!-- Favicon (Browser-Tab/URL-Leiste) & Home-Bildschirm-Icon -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Events" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <!-- Tab-artige Reiter für die Tage (springen zum jeweiligen Tag) -->
    <nav class="day-tabs" id="day-tabs" aria-label="Nach Tag springen"></nav>

    <!-- Tags immer sichtbar; Suche klappt per Lupe in derselben Zeile aus -->
    <div class="filter-bar">
      <div class="tag-filter" id="tag-filter"></div>
      <input
        type="search"
        id="search"
        class="search-input"
        placeholder="Suchen …"
        autocomplete="off"
        hidden
      />
      <button
        type="button"
        class="search-toggle"
        id="search-toggle"
        aria-label="Suche ein-/ausblenden"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="16.5" y1="16.5" x2="21" y2="21" />
        </svg>
      </button>
    </div>
  </header>

  <main id="feed" class="feed">
    <p class="status" id="status">Lade Veranstaltungen …</p>
  </main>

  <footer class="site-footer">
    <p id="footer-note"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
