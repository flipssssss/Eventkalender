<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3e9d8" />
  <title>Eventkalender</title>

  <!-- Favicon (Browser-Tab/URL-Leiste) & Home-Bildschirm-Icon -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Events" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Schriften für das Hyperpop-Theme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Theme früh setzen, um Aufblitzen zu vermeiden -->
  <script>
    try {
      var t = localStorage.getItem("ek_theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <!-- Zeile 1: Tage (springen) + Suche + Einstellungen -->
    <div class="header-row header-row--dates">
      <nav class="day-tabs" id="day-tabs" aria-label="Nach Tag springen"></nav>
      <input
        type="search"
        id="search"
        class="search-input"
        placeholder="Suchen …"
        autocomplete="off"
        hidden
      />
      <button
        type="button"
        class="icon-toggle"
        id="search-toggle"
        aria-label="Suche ein-/ausblenden"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="16.5" y1="16.5" x2="21" y2="21" />
        </svg>
      </button>
      <button type="button" class="icon-toggle" id="settings-open"
              aria-label="Einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>

    <!-- Zeile 2: Genres + Favoriten -->
    <div class="header-row header-row--genres">
      <div class="genre-filter" id="genre-filter"></div>
      <button
        type="button"
        class="icon-toggle"
        id="fav-toggle"
        aria-label="Nur Gemerkte zeigen"
        aria-pressed="false"
        title="Nur Gemerkte"
      >♥</button>
    </div>

    <!-- Zeile 3: Kategorien (horizontal scrollbar + Aufklapp-Pfeil) -->
    <div class="header-row header-row--categories">
      <div class="tag-filter" id="tag-filter"></div>
      <button type="button" class="cat-expand" id="cat-expand"
              aria-label="Kategorien aufklappen" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
    </div>
  </header>

  <main id="feed" class="feed">
    <p class="status" id="status">Lade Veranstaltungen …</p>
  </main>

  <footer class="site-footer">
    <p id="footer-note"></p>
  </footer>

  <!-- Einstellungen -->
  <div class="modal-backdrop" id="settings-backdrop" hidden>
    <div class="modal settings-panel" role="dialog" aria-modal="true" aria-label="Einstellungen">
      <button type="button" class="modal-close" id="settings-close" aria-label="Schließen">✕</button>
      <div class="modal-body">
        <h2 class="modal-title">Einstellungen</h2>

        <section class="settings-section">
          <h3 class="settings-h">Design</h3>
          <div class="theme-options" id="theme-options">
            <button type="button" class="theme-btn" data-theme="buergi">Bürgi</button>
            <button type="button" class="theme-btn" data-theme="punk">Punk</button>
            <button type="button" class="theme-btn" data-theme="hyperpop">Hyperpop</button>
          </div>
        </section>

        <section class="settings-section">
          <h3 class="settings-h">Quellen</h3>
          <div id="source-toggles" class="source-toggles"></div>
        </section>

        <section class="settings-section">
          <h3 class="settings-h">Quelle vorschlagen</h3>
          <textarea id="wish-text" class="wish-text" rows="3"
            placeholder="Welche Website/Quelle fehlt dir? Adresse + kurz, was es ist."></textarea>
          <button type="button" class="btn btn--primary" id="wish-send">Senden</button>
          <p class="settings-hint">Geht an die Betreiber:innen – ohne Anmeldung.</p>
        </section>
      </div>
    </div>
  </div>

  <!-- Detail-Vorschau -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Veranstaltung">
      <button type="button" class="modal-close" id="modal-close" aria-label="Schließen">✕</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
