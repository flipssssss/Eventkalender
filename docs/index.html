<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Eventkalender</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <!-- Tab-artige Reiter für die Tage (springen zum jeweiligen Tag) -->
    <nav class="day-tabs" id="day-tabs" aria-label="Nach Tag springen"></nav>

    <!-- Suche & Tags: aufklappbar, in einer Spalte -->
    <button
      type="button"
      class="filter-toggle"
      id="filter-toggle"
      aria-expanded="false"
      aria-controls="filter-panel"
    >
      <span class="filter-toggle-label">Suchen &amp; Filtern</span>
      <span class="filter-toggle-meta" id="subtitle"></span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div class="filter-panel" id="filter-panel" hidden>
      <input
        type="search"
        id="search"
        placeholder="Suchen (Titel, Ort, Beschreibung) …"
        autocomplete="off"
      />
      <div class="tag-filter" id="tag-filter"></div>
    </div>
  </header>

  <main id="feed" class="feed">
    <p class="status" id="status">Lade Veranstaltungen …</p>
  </main>

  <footer class="site-footer">
    <p id="footer-note"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
