# =====================================================================
#  Veranstaltungs-Quellen
# =====================================================================
#
# Hier trägst du die Websites ein, von denen Veranstaltungen geholt
# werden sollen. Jeder Eintrag wird mit dem generischen JSON-LD-Ausleser
# verarbeitet, der bei sehr vielen Event-Seiten ohne weitere
# Programmierung funktioniert.
#
# Felder pro Eintrag:
#   url   (Pflicht)  Adresse der Quelle (Webseite oder iCal-Feed)
#   name  (optional) Anzeigename der Quelle im Feed
#   tags  (optional) Tags, die jedem Event dieser Quelle hinzugefügt
#                    werden (z. B. die Stadt)
#   type     (optional) "jsonld" (Standard, normale Webseiten) oder
#                        "ical" für .ics-Kalenderfeeds
#   category (optional) erzwingt EINEN festen Tag für alle Events dieser
#                        Quelle (z. B. Konzert, Party) -- ignoriert die
#                        Kategorien der Seite
#   extra_urls (optional) weitere Unterseiten derselben Quelle
#
# Beispiel (normale Webseite):
#   - url: https://www.beispielstadt.de/veranstaltungen
#     name: Stadt Beispielstadt
#     category: Konzert
#
# Beispiel (iCal-Feed):
#   - url: https://example.org/feed.ics
#     name: Beispiel-Kalender
#     type: ical
#
# Nach dem Bearbeiten einfach speichern und committen -- die Automatik
# aktualisiert den Feed dann automatisch.
# ---------------------------------------------------------------------

# Hinweis: Stressfaktor wird über einen eigenen Ausleser eingebunden
# (scrapers/stressfaktor.py, in aggregate.py registriert), weil die
# Originalseite einen Bot-Schutz hat.
sources:
  # Hacker-/Community-Spaces.
  # c-base: exportiert iCal. Nur den Events-Feed nehmen (echte Veranstaltungen),
  # NICHT die "Gesammelte" Datei -- die mischt regulars.ics (wiederkehrende
  # interne Treffen) und seminars.ics (Raumbuchungen) mit rein.
  - url: https://www.c-base.org/calendar/exported/events.ics
    name: c-base
    type: ical
  # xHain: statischer Hugo-Kalender ohne JSON-LD; Hugo gibt das Kalender-
  # Listing zusätzlich als .ics aus (Test; sonst eigener Ausleser nötig).
  - url: https://x-hain.de/de/calendar/index.ics
    name: xHain
    type: ical
  # CCC Berlin: vorheriger Versuch "Network is unreachable" (evtl. IPv6-only/
  # transient). Mehrere Wege testen -> Debug zeigt, welcher Host/Feed verbindet.
  - url: https://berlin.ccc.de/verein/calendar/index.ics
    name: CCC Berlin
    type: ical
  - url: https://www.berlin.ccc.de/verein/calendar/
    name: CCC www-Probe

  # Silverfuture (queere Bar, Neukölln) -- Kategorie automatisch,
  # Genre "Queer" via scrapers/genres.py.
  # Silverfuture -> eigener Ausleser (scrapers/silverfuture.py, Jimdo-Text).
  # Klub Verboten (RA) -> eigene Sonde (scrapers/klubverboten.py, RA blockt HTML).

  # Kink-Quellen -- alle Events als Kink. Beide nutzen "The Events
  # Calendar" (WordPress); der iCal-Feed ist robust und umgeht teils
  # den Bot-Schutz der HTML-Seite.
  # Kategorie kommt aus den iCal-Daten; das Genre "Kink" wird in
  # scrapers/genres.py je Quelle gesetzt.
  - url: https://quaelgeist.sm/?post_type=tribe_events&ical=1&eventDisplay=list
    name: Quälgeist
    type: ical
    party_or_workshop: true   # je Event Party oder Workshop
  - url: https://karada-house.de/?post_type=tribe_events&ical=1&eventDisplay=list
    name: Karada House
    type: ical
    category: Workshop        # alle Karada-Events als Workshop
  # Rosa-Luxemburg-Stiftung -- politische Vorträge/Diskussionen.
  # Alle Events als Vortrag; Genre "Polit" via scrapers/genres.py (FORCE_GENRE).
  # Rosa-Luxemburg-Stiftung -> eigener Ausleser (scrapers/rosalux.py): die
  # Seite hat kein JSON-LD, sondern server-gerenderte Teaser; nur Berlin.
  # FunFacts -> eigener Ausleser (scrapers/funfacts.py): Wix-Events ohne
  # JSON-LD, server-gerenderte data-hooks; nur Berlin (Mehringhof-Theater).

  # Planetarium Berlin -> eigener Ausleser (scrapers/planetarium.py): /tickets
  # ist eine SPA; gelesen werden die server-gerenderten Drupal-Taxonomie-Seiten
  # /veranstaltungsart/highlights-konzerte und /hoerspiele-lesungen.

  # Möbel Olfe -> eigener Ausleser (scrapers/moebelolfe.py): statische Tabelle.
  # Other Nature -> eigener Ausleser (scrapers/othernature.py): Shopify-Atom.
  # IKSK Berlin -> eigener Ausleser (scrapers/iksk.py): server-gerendert.
  # Berlin Kink Calendar: weggelassen -- Events werden client-seitig (Ghost/
  # Airtable) gerendert, ohne JS nicht erreichbar; BDSM Berlin deckt Ähnliches.
  # Kink-Quellen mit JSON-LD bzw. iCal:
  - url: https://bdsm-berlin.de/kalender/
    name: BDSM Berlin
  # Folsom Europe nutzt "The Events Calendar" -> iCal-Feed der Event-Liste.
  # (Festival im September; erscheint erst, wenn die Termine ins Zeitfenster
  # rutschen.)
  - url: https://folsomeurope.berlin/events/?ical=1
    name: Folsom Europe
    type: ical

  # Jazz-Clubs -- alle Events als Konzert (Genre Kultur per Default).
  # A-Trane -> eigener Ausleser (scrapers/atrane.py): JSON-LD, aber der Titel
  # wird aus dem <br>-Werbeblock destilliert; B-flat (Squarespace) und
  # visitBerlin (Detailseiten) laufen über eigene Ausleser.
  # Zig Zag (zigzag-jazzclub.de) raus: Server lehnt den TLS-Handshake ab
  # (TLSV1_ALERT_INTERNAL_ERROR), von außen nicht erreichbar.
  # askapunk -> eigener Ausleser (scrapers/gancio.py): Gancio-Kalender mit
  # JSON-API (/api/events), inkl. Bilder. In aggregate.py registriert.
  # Boiler -> eigener Ausleser (scrapers/boiler.py), HTML-Liste.
  # Time to Shine -> eigener Ausleser (scrapers/timetoshine.py), Squarespace-JSON.
  # Party Dyke Berlin -> eigener Ausleser (scrapers/partydyke.py), weil die
  # Wix-Seite clientseitig rendert und die Daten nur auf den Detailseiten
  # (als JSON-LD) stehen.
  # tip Berlin: eigener Ausleser (scrapers/tipberlin.py) wegen Bot-Schutz.
  # Siegessäule wird über einen eigenen Ausleser eingebunden
  # (scrapers/siegessaeule.py), weil die Events in einem Sapper-Preload
  # stecken; Kategorie automatisch je Event.
  # Donau115 wird über einen eigenen Ausleser eingebunden
  # (scrapers/donau115.py), weil die Events aus einer Firebase-DB kommen.
  # Tipsy Bear (tipsybearberlin.com) blockt automatisierte Zugriffe (403).
